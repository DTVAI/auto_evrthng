name: Toolbox validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-quality.lock
      - run: ruff format --check app tests
      - run: python -m pytest -q -W error
      - run: python -m compileall -q app tests
      - run: node --check app/static/app.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-browser.lock
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance against isolated local database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 -p test-results/db
          export TOOLBOX_DATABASE_URL="sqlite:///$PWD/test-results/db/browser.db"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >test-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser_smoke.py
          python tests/browser_optimizations.py
